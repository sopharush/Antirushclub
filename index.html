<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Mark JS-on so pre-reveal hidden states apply only when motion can run.
         With JS off, nothing is hidden and all content stays visible. */
      document.documentElement.classList.add('js');
    </script>
    <title>Anti-Rush Club — Come as you are. Slow down. Stay awhile.</title>
    <meta name="description" content="Anti-Rush Club — a safe place where the pressures of life no longer define us, because our richness is found in God, not the world. Slow down. Look up. Stay awhile." />
    <meta name="theme-color" content="#efe3c8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:site_name" content="Anti-Rush Club" />
    <meta property="og:title" content="Anti-Rush Club — Come as you are. Slow down. Stay awhile." />
    <meta property="og:description" content="More presence. Less pressure. A slow-living club, rooted in faith." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anti-rush-club.netlify.app/" />
    <meta property="og:image" content="https://anti-rush-club.netlify.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anti-Rush Club" />
    <meta name="twitter:description" content="More presence. Less pressure. A slow-living club, rooted in faith." />
    <meta name="twitter:image" content="https://anti-rush-club.netlify.app/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify Forms detection: static form so Netlify captures Mail Club signups. -->
    <form name="mail-club" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="email" name="email" />
      <input type="hidden" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
