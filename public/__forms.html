<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="robots" content="noindex" /><title>Forms</title></head>
  <body>
    <!-- Netlify Forms detection skeleton for the JS-rendered Mail Club form.
         Field names must match what MailClubModal submits. -->
    <form name="mail-club" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="mail-club" />
      <input type="text" name="firstName" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <form name="club-updates" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="club-updates" />
      <input type="text" name="firstName" />
      <input type="email" name="email" />
      <input type="text" name="interests" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
